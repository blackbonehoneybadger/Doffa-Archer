name: checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Show runtime
        run: node --version
      - name: Run source, secret, and unit checks
        run: |
          node scripts/check-source.mjs
          node scripts/secret-scan.mjs
          node --test
